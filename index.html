<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahasiswa Undip - Digital Platform</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/u/0/d/1Z1Pk5fW79Ytk4Bn-umtBmLKZ0tMxc7uD">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Reset Dasar & Variabel Warna Neo-Brutalism */
        :root {
            --bg-canvas: #f4f4f0;
            --card-white: #ffffff;
            --ink-black: #111111;
            --text-muted: #4b5563;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-yellow: #fde047;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background Off-White dengan Dot Grid Minimalis */
        body {
            background-color: var(--bg-canvas);
            background-image: radial-gradient(#cbd5e1 1.25px, transparent 1.25px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--ink-black);
        }

        /* Container Utama: Card Putih + Border Tebal + Hard Drop Shadow */
        .container {
            background-color: var(--card-white);
            border: 3px solid var(--ink-black);
            border-radius: 16px;
            box-shadow: 8px 8px 0px var(--ink-black);
            padding: 36px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* Avatar dengan Border Tebal & Hard Shadow */
        .profile-area .avatar {
            display: inline-block;
            margin-bottom: 18px;
        }

        .profile-area .avatar img {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            border: 3px solid var(--ink-black);
            object-fit: cover;
            display: block;
            background-color: var(--card-white);
            box-shadow: 4px 4px 0px var(--accent-blue);
        }

        .profile-area h1 {
            color: var(--ink-black);
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        /* Titik Aksen Biru pada Judul */
        .profile-area h1 .accent-dot {
            color: var(--accent-blue);
        }

        .profile-area .bio {
            color: var(--text-muted);
            font-size: 0.925rem;
            font-weight: 500;
            margin-bottom: 28px;
            line-height: 1.45;
            padding: 0 8px;
        }

        /* Area Daftar Tombol */
        .links-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Card Tombol Standar */
        .link-card {
            background-color: var(--card-white);
            border: 2.5px solid var(--ink-black);
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--ink-black);
            padding: 15px 20px;
            text-decoration: none;
            color: var(--ink-black);
            font-weight: 700;
            font-size: 0.975rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        }

        .link-card .arrow {
            font-weight: 800;
            font-size: 1.1rem;
            transition: transform 0.12s ease;
        }

        /* Efek Hover Desktop */
        @media (hover: hover) {
            .link-card:hover {
                background-color: var(--accent-yellow);
                transform: translate(-2px, -2px);
                box-shadow: 6px 6px 0px var(--ink-black);
            }

            .link-card:hover .arrow {
                transform: translate(2px, -2px);
            }
        }

        /* Efek Tekan Fisik (Klik / Tap Mobile) */
        .link-card:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--ink-black);
        }

        /* Tombol Utama (Featured) — Biru Solid dengan Kontras Tinggi */
        .link-card.featured {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        @media (hover: hover) {
            .link-card.featured:hover {
                background-color: var(--accent-blue-hover);
                color: #ffffff;
                transform: translate(-2px, -2px);
                box-shadow: 6px 6px 0px var(--ink-black);
            }
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 2px dashed #e2e8f0;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <main class="container">
        <header class="profile-area">
            <div class="avatar">
                <img src="https://lh3.googleusercontent.com/u/0/d/1Z1Pk5fW79Ytk4Bn-umtBmLKZ0tMxc7uD" alt="Logo Mahasiswa Undip">
            </div>
            <h1>Mahasiswa Undip<span class="accent-dot">.id</span></h1>
            <p class="bio">Digital Platform &amp; Informasi Komunitas Mahasiswa Undip</p>
        </header>

        <nav class="links-area" aria-label="Tautan Utama">
            <a href="https://anjem.mahasiswaundip.my.id" class="link-card featured" target="_blank" rel="noopener noreferrer">
                <span>Grup Anjem</span>
                <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>

            <a href="https://instagram.com/mahasiswaundip.id" class="link-card" target="_blank" rel="noopener noreferrer">
                <span>Instagram</span>
                <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>

            <a href="https://tiktok.com/@mahasiswaundip.id" class="link-card" target="_blank" rel="noopener noreferrer">
                <span>TikTok</span>
                <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>
            
            <a href="https://wa.me/message/XPJKQLB2HZQIM1" class="link-card" target="_blank" rel="noopener noreferrer">
                <span>Hubungi Admin</span>
                <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>

            <!-- Tombol Navigasi ke Halaman Kedua (Media Partner) -->
            <a href="MediaPartner.html" class="link-card">
                <span>Syarat Media Partner</span>
                <span class="arrow" aria-hidden="true">&#8594;</span>
            </a>
        </nav>

        <footer class="footer">
            <p>&copy; 2026 Mahasiswa Undip Id. All rights reserved.</p>
        </footer>
    </main>

</body>
</html>
